<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual workout report contract boundary</title>
  <desc id="desc">A conceptual boundary map, not an app screenshot, showing eligible completed sessions producing a one-way CSV or JSON report.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071321"/><stop offset="1" stop-color="#163449"/></linearGradient>
    <filter id="shadow2"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  <text x="96" y="96" fill="#F6FAFD" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="52" font-weight="700">Workout report boundary</text>
  <text x="98" y="142" fill="#8FB8CC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24">Conceptual contract map — not an app screenshot</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" filter="url(#shadow2)">
    <rect x="95" y="226" width="405" height="486" rx="34" fill="#0D2235" stroke="#2D5269"/>
    <text x="138" y="282" fill="#F6FAFD" font-size="24" font-weight="700">SESSION CANDIDATES</text>
    <g font-size="21">
      <rect x="138" y="329" width="319" height="68" rx="17" fill="#153D55"/><circle cx="177" cy="363" r="13" fill="#35C3B4"/><text x="207" y="371" fill="#F6FAFD">Completed + structurally valid</text>
      <rect x="138" y="418" width="319" height="68" rx="17" fill="#2A2934"/><circle cx="177" cy="452" r="13" fill="#E47762"/><text x="207" y="460" fill="#D8E1E7">Active or incomplete</text>
      <rect x="138" y="507" width="319" height="68" rx="17" fill="#2A2934"/><circle cx="177" cy="541" r="13" fill="#E47762"/><text x="207" y="549" fill="#D8E1E7">Abandoned or removed</text>
      <rect x="138" y="596" width="319" height="68" rx="17" fill="#2A2934"/><circle cx="177" cy="630" r="13" fill="#E47762"/><text x="207" y="638" fill="#D8E1E7">Malformed or future-invalid</text>
    </g>

    <path d="M535 468 H608" stroke="#5FA7DD" stroke-width="8" stroke-linecap="round"/><path d="M596 452 L618 468 L596 484" fill="none" stroke="#5FA7DD" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="644" y="226" width="368" height="486" rx="34" fill="#12344B" stroke="#5FA7DD" stroke-width="2"/>
    <text x="688" y="282" fill="#5FA7DD" font-size="22" font-weight="700">ELIGIBILITY PREVIEW</text>
    <text x="688" y="350" fill="#F6FAFD" font-size="28" font-weight="700">Candidates</text><text x="945" y="350" text-anchor="end" fill="#A9C2CF" font-size="28">N</text>
    <line x1="688" y1="376" x2="968" y2="376" stroke="#2D5269"/>
    <text x="688" y="428" fill="#F6FAFD" font-size="28" font-weight="700">Included</text><text x="945" y="428" text-anchor="end" fill="#35C3B4" font-size="28">N</text>
    <line x1="688" y1="454" x2="968" y2="454" stroke="#2D5269"/>
    <text x="688" y="506" fill="#F6FAFD" font-size="28" font-weight="700">Excluded</text><text x="945" y="506" text-anchor="end" fill="#E47762" font-size="28">N</text>
    <rect x="688" y="566" width="280" height="92" rx="20" fill="#0D2235"/>
    <text x="828" y="606" text-anchor="middle" fill="#F2B84B" font-size="21" font-weight="700">VERSIONED CONTRACT</text>
    <text x="828" y="639" text-anchor="middle" fill="#A9C2CF" font-size="18">explicit schema + capture context</text>

    <path d="M1048 468 H1121" stroke="#F2B84B" stroke-width="8" stroke-linecap="round"/><path d="M1109 452 L1131 468 L1109 484" fill="none" stroke="#F2B84B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="1158" y="226" width="345" height="486" rx="34" fill="#0D2235" stroke="#F2B84B" stroke-width="2"/>
    <text x="1202" y="282" fill="#F2B84B" font-size="22" font-weight="700">ONE-WAY OUTPUT</text>
    <rect x="1202" y="328" width="112" height="76" rx="18" fill="#153D55"/><text x="1258" y="377" text-anchor="middle" fill="#F6FAFD" font-size="27" font-weight="700">CSV</text>
    <rect x="1340" y="328" width="119" height="76" rx="18" fill="#153D55"/><text x="1399" y="377" text-anchor="middle" fill="#F6FAFD" font-size="27" font-weight="700">JSON</text>
    <text x="1202" y="474" fill="#F6FAFD" font-size="31" font-weight="750">REPORT_ONLY</text>
    <text x="1202" y="521" fill="#E47762" font-size="27" font-weight="700">restorable = false</text>
    <line x1="1202" y1="555" x2="1459" y2="555" stroke="#2D5269"/>
    <text x="1202" y="602" fill="#A9C2CF" font-size="20">Not a backup</text>
    <text x="1202" y="638" fill="#A9C2CF" font-size="20">Not a restore point</text>
    <text x="1202" y="674" fill="#A9C2CF" font-size="20">Not device sync</text>
  </g>
  <text x="96" y="814" fill="#F6FAFD" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="26" font-weight="650">The design decision: a readable report must not be mistaken for a recoverable application archive.</text>
  <text x="96" y="854" fill="#7795A6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20">Public case-study diagram · no workout records or private implementation details included</text>
</svg>

